name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Restore debug keystore from encrypted file
        # The signing key is stored AES-256-encrypted in debug.keystore.enc
        # (committed to the repo — ciphertext only, safe to publish); the
        # passphrase lives in the GitHub secret DEBUG_KEYSTORE_PASSPHRASE.
        # This replaces the base64 secret, whose 3.5 KB value was corrupted
        # twice on entry (runs #11/#12 failed to decode it). Verify the
        # decrypted keystore reads back, so a wrong passphrase fails loudly.
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.DEBUG_KEYSTORE_PASSPHRASE }}
        run: |
          mkdir -p ~/.android
          if [ -z "$KEYSTORE_PASSPHRASE" ]; then
            echo "DEBUG_KEYSTORE_PASSPHRASE secret is not set" >&2
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in debug.keystore.enc -out ~/.android/debug.keystore -pass pass:"$KEYSTORE_PASSPHRASE"
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey > /dev/null

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveDelivery-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
