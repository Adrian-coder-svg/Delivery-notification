name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Restore debug keystore from secret
        # The signing key lives in the GitHub secret DEBUG_KEYSTORE_BASE64
        # (base64 of the debug.keystore), never in the repo — the repo is
        # public. Every build restores the same key so all builds share one
        # signature and can install over each other. Fail loudly if the
        # secret is missing; never silently fall back to a fresh key, or
        # the signature changes and the app can no longer update in place.
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "DEBUG_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -di > ~/.android/debug.keystore

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveDelivery-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
